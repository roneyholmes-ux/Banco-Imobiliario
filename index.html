<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Imobiliário</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Container Principal da Partida -->
    <div id="game-section-area">
        <main class="game-container">
            
            <!-- Tabuleiro Grid 11x11 (Renderizado dinamicamente via JS) -->
            <div id="board"></div>

            <!-- Painel Lateral de Controle -->
            <aside class="sidebar">
                <h2>Banco Imobiliário</h2>
                
                <!-- Caixa de Mensagens / Notificações do Jogo -->
                <div id="game-status">
                    <p>Carregando jogo...</p>
                </div>

                <!-- Botões de Ação do Turno -->
                <div class="actions-panel">
                    <button id="rollDice">🎲 Jogar Dados</button>
                </div>

                <h3>Jogadores</h3>
                <!-- Lista com Jogadores, Dinheiro e Fichas -->
                <div id="players-list"></div>
            </aside>

        </main>
    </div>

    <!-- Script Principal -->
    <script src="js/script.js"></script>
</body>
</html>
