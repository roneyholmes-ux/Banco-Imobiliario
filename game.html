<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Jogo - Banco Imobiliário</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Biblioteca PeerJS para Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body style="background: #0b131e;">

    <!-- BARRA SUPERIOR DO JOGO -->
    <nav class="navbar" style="position: relative; background: #070c14;">
        <div class="nav-logo">🎲 BANCO IMOBILIÁRIO</div>
        <ul class="nav-links">
            <li><a href="index.html" style="color: #ff4757; font-weight: bold;">⬅️ Sair para o Menu</a></li>
        </ul>
    </nav>

    <!-- MESA DE JOGO PRINCIPAL -->
    <main class="section-game">
        <div class="section-container">
            <div class="container">
                <!-- TABULEIRO GRID 11x11 -->
                <div id="board" class="board"></div>

                <!-- PAINEL LATERAL DE CONTROLE -->
                <div class="control-panel">
                    <div class="status-box">
                        <h3>Painel de Controle</h3>
                        <div id="dice-display" style="font-size: 1.2rem; font-weight: bold; color: #38bdf8; margin-bottom: 8px;">🎲 --</div>
                        <div id="game-status" style="margin-bottom: 15px;">Iniciando partida...</div>
                        <div style="display: flex; gap: 8px;">
                            <button id="rollDice" class="dice-btn" onclick="rollDice()">🎲 Jogar Dado</button>
                        </div>
                    </div>

                    <div class="players-box">
                        <h3>Jogadores</h3>
                        <div id="players-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- CARREGAMENTO DE SCRIPTS NA ORDEM CORRETA DE DEPENDÊNCIA -->
    <script src="js/multiplayer.js"></script>
    <script src="js/network.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/game.js"></script>
    <script src="js/ui.js"></script>

    <!-- INICIALIZADOR CONFORME O MODO (URL QUERY) -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const mode = urlParams.get('mode');

            if (typeof renderBoard === 'function') {
                renderBoard();
            }

            if (mode === 'online') {
                // Chama a abertura do menu de sala na camada Multiplayer
                if (window.Multiplayer && typeof window.Multiplayer.openOnlineMenu === 'function') {
                    window.Multiplayer.openOnlineMenu();
                } else {
                    alert("Erro ao carregar módulo online: window.Multiplayer não encontrado.");
                }
            } else {
                // Modo Local Padrão
                if (typeof startPlayerSetup === 'function') {
                    startPlayerSetup();
                }
            }
        });
    </script>
</body>
</html>
